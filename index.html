<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
        <style>
            body {
                background-color: #000000;
                color: #e6c594;
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 20px;
            }

            .splide {
                max-width: 700px;
                margin: 0 auto;
            }

            .slide-content {
                text-align: center;
                padding: 20px;
            }

            .slide-content img {
                max-width: 500px;
                max-height: 350px;
                width: 100%;
                height: auto;
                object-fit: cover;
                border-radius: 8px;
                margin: 0 auto 15px auto;
                display: block;
            }

            .slide-content h3 {
                color: #f0d5a8;
                font-size: 1.4rem;
                margin: 10px 0;
            }

            .slide-content p {
                color: #d2b48c;
                font-size: 1rem;
                line-height: 1.5;
                margin: 0;
            }
        </style>
    </head>
    <body>

        <section class="splide" aria-label="Ana Urushadze Films">
            <div class="splide__track">
                <ul class="splide__list" id="splide-list">
                    <!-- Dynamic slides -->
                </ul>
            </div>
        </section>

        <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                var slidesData = [
                    {
                        image: "ana 1.jpg",
                        title: "მეორე ხარისხოვანი როლი",
                        description: "ანა ურუშაძის სრულმეტრაჟიანი ფილმი, რომელმაც დიდ წარმატებას მიაღწია საერთაშორისო კინო ფესტივალებზე."
                    },
                    {
                        image: "ana2.jpg",
                        title: "საშიში დედა",
                        description: "ანა ურუშაძის პირველი სრულმეტრაჟიანი ფილმი, რომელმაც საერთაშორისო წარმატებას მიაღწია."
                    },
                    {
                        image: "ana3.jpg",
                        title: "ერთ კაცს ვუყვარდი",
                        description: "ანა ურუშაძის ერთ-ერთი პირველი ნამუშევარი."
                    },
                    {
                        image: "ana4.jpg",
                        title: "ანა ურუშაძე",
                        description: "ანა ურუშაძე ქართველი ახალგაზრდა კინორეჟისორია, რომელიც ცნობილია თავისი საინტერესო და ღრმა ფილმებით."
                    }
                ];

                var list = document.getElementById('splide-list');

                slidesData.forEach(function (item) {
                    var li = document.createElement('li');
                    li.className = 'splide__slide';
                    li.innerHTML = `
                        <div class="slide-content">
                            <img src="${item.image}" alt="${item.title}">
                            <h3>,,${item.title}''</h3>
                            <p>${item.description}</p>
                        </div>
                    `;
                    list.appendChild(li);
                });

                var splide = new Splide('.splide');
                splide.mount();
            });
        </script>
    </body>
</html>
